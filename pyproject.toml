[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgate"
version = "0.1.0"
description = "Decide what an AI system should remember: policy-driven memory gating with typed judgments."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Afnan Hussain" }]
keywords = ["memory", "agents", "llm", "policy", "jev"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
# httpx is already a core dependency, so Jev needs nothing extra; the extra exists
# so `pip install "memgate[jev]"` documents intent and can grow later.
jev = []
mem0 = ["mem0ai>=2.2,<2.3"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "mypy>=1.10",
  "ruff>=0.6",
  "types-PyYAML",
  "python-dotenv>=1",
  "matplotlib>=3.8",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
memgate = "memgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memgate"]

[tool.hatch.build.targets.sdist]
include = ["src/memgate", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "playground/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "SIM905"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mem0", "mem0.*"]
ignore_missing_imports = true

# Plotting is optional; numpy's stubs use 3.12-only syntax that mypy rejects for 3.10.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "contract: contract tests against recorded responses, pinned adapters and sample files",
  "live: real API calls; skipped unless keys are set",
]
addopts = "-m 'not live'"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
