# dev-sessions: turn Claude Code and Codex sessions into a project knowledge base.
# Copy and edit freely; every change should bump the version.
policy: dev-sessions
version: "1.1"
description: >
  Keeps tasks, fixes, decisions, discussions, codebase explanations, project-specific concepts
  and conventions; drops noise, abandoned approaches and generic textbook content; redacts
  secrets; labels unverified fixes, ungrounded explanations and open questions; sends
  unendorsed proposals to review; supersedes entries that a later decision replaces.
sessions: {noise_threshold: 0.8, min_user_words: 8, gap_minutes: 30}
types:
  task: Work that was carried out, with its goal and final status
  fix: A bug or problem, its cause, and the change made to resolve it
  decision: A choice between approaches, made or proposed, with its reasoning
  discussion: An exchange of ideas that may or may not reach a conclusion
  explanation: How a specific module, file or data flow in this codebase works
  concept: A technical insight or lesson (why something behaves as it does), general or project-specific
  convention: A rule or preference for how work is done in this project
  noise: Routine setup, retries, checks, small talk or raw output with no lasting value
signals:
  secret: {check: secret_scan}
  verified: {check: outcome_verified}
  grounded: {check: file_was_read}
  endorsed: {noul: "Did the user state this themselves or clearly approve it (not just hear it suggested)?", applies_to: [decision, convention, discussion]}
  concluded: {noul: "Did the discussion reach a clear conclusion?", applies_to: [discussion]}
  superseded_later: {noul: "Was this approach abandoned or replaced later in the session?"}
  project_specific: {noul: "Is this specific to this project rather than generic knowledge?", applies_to: [concept, explanation]}
  worth_keeping: {noul: "Would a developer returning to this project in a month benefit from this?"}
  routine: {noul: "Does this describe only routine housekeeping (installing dependencies, rerunning commands, checking status, greetings) rather than real work or knowledge?"}
rules:
  - {name: secrets, when: "secret", then: redact}
  - {name: noise, when: "type == 'noise' or worth_keeping < 0.5 or routine > 0.7", then: reject}
  - {name: abandoned, when: "superseded_later > 0.7", then: reject}
  - {name: generic, when: "type == 'concept' and project_specific < 0.5", then: reject}
  - {name: unverified_work, when: "type in ['fix', 'task'] and not verified", then: store_labeled, label: unverified}
  - {name: ungrounded, when: "type == 'explanation' and not grounded", then: store_labeled, label: unverified}
  - {name: open_question, when: "type == 'discussion' and concluded < 0.5", then: store_labeled, label: open-question}
  - {name: proposal_only, when: "type in ['decision', 'convention'] and endorsed < 0.6", then: review}
  - {name: replaces, when: "conflict and conflict.p > 0.7", then: supersede}
  - {else: store}
conflict:
  k: 5
  prompt: "Which existing knowledge-base entry is no longer accurate once the candidate memory is true?"
